  <text x="22" y="13" fill="#f85149" font-size="16">x3</text>
  <circle cx="70" cy="7" r="7" fill="#e3b341"/><rect x="68.5" y="2" width="3" height="10" fill="#9e6a03"/>
  <text class="c7" x="84" y="13" fill="#e3b341" font-size="16">07</text>
  <text class="c8" x="84" y="13" fill="#e3b341" font-size="16">08</text>
  <text x="122" y="13" fill="#79c0ff" font-size="16">WORLD ~/busiso</text>
  <path d="M290 0l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z" fill="#e3b341"/>
</g>

<text x="28" y="100" font-size="16"><tspan fill="#f85149">➤</tspan><tspan fill="#e6edf3" dx="10">whoami</tspan></text>
<rect class="cov" x="45" y="84" width="68" height="22" fill="#0d1117"/>
<rect class="cur" x="108" y="86" width="9" height="18" fill="#e6edf3" opacity=".8"/>

<g class="ln" style="animation-delay:2s"><text x="28" y="140" fill="#f0f6fc" font-size="24" font-weight="bold">Busiso Ndumo</text></g>
<g class="ln" style="animation-delay:2.4s"><text x="28" y="168" fill="#8b949e" font-size="15">Software Developer · WeThinkCode_ Student</text></g>
<g class="ln" style="animation-delay:2.8s"><path d="M33 182a5 5 0 0 1 10 0c0 4-5 9-5 9s-5-5-5-9z" fill="#3fb950"/><circle cx="38" cy="182" r="1.8" fill="#0d1117"/><text x="52" y="192" fill="#8b949e" font-size="15">Johannesburg, South Africa</text></g>
<g class="ln" style="animation-delay:3.2s"><text x="28" y="226" fill="#c9d1d9" font-size="15">Languages: Java · Python · C · JavaScript</text><text x="28" y="246" fill="#c9d1d9" font-size="15">I enjoy understanding why systems work, not just how.</text></g>
<g class="ln" style="animation-delay:3.6s"><text x="28" y="278" font-size="15"><tspan fill="#e3b341">Philosophy:</tspan><tspan fill="#c9d1d9"> Keep learning. Keep building.</tspan></text></g>

