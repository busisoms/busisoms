<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-label="Mario-inspired GitHub terminal showing interests and current focus as JSON, with an orange pixel cat walking along the ground">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.row{opacity:0;animation:appear 15s ease-out infinite}
@keyframes appear{0%{opacity:0}2%,88%{opacity:1}90%,100%{opacity:0}}
.cursor{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.walker{animation:walk 14s linear infinite}
@keyframes walk{0%{transform:translate(330px,370px)}46%,50%{transform:translate(720px,370px)}96%,100%{transform:translate(330px,370px)}}
.face{transform-box:fill-box;transform-origin:center;animation:face 14s step-end infinite}
@keyframes face{0%{transform:scaleX(1)}48%{transform:scaleX(-1)}98%{transform:scaleX(1)}}
.step{animation:step .5s step-end infinite}
@keyframes step{50%{transform:translateY(-1px)}}
.legA{animation:legs .5s step-end infinite}
.legB{animation:legs .5s step-end -.25s infinite}
@keyframes legs{50%{transform:translateY(-3px)}}
.tail{animation:wag 1.2s steps(2,end) infinite;transform-origin:6px 18px}
@keyframes wag{50%{transform:rotate(-16deg)}}
.eyes{animation:catblink 5s step-end infinite;transform-origin:center 18px}
@keyframes catblink{0%,94%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.row{opacity:1;animation:none}.cursor,.walker,.face,.step,.legA,.legB,.tail,.eyes{animation:none}.walker{transform:translate(720px,370px)}}
</style>
